<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisaab: financial and date calculators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#E9EFEB; --panel:#FFFFFF; --pine:#0D3B33; --marigold:#F0A500; --moss:#2E8B68; --brick:#C4472D;
  --ink:#18302A; --muted:#5A6E67; --line:#D3DDD7;
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:var(--pine);color:#D5E6DF;position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 14px 28px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;text-decoration:none}
.mark{width:40px;height:40px;border-radius:50%;background:var(--marigold);color:var(--pine);display:grid;place-items:center;font:600 22px var(--serif);flex:none}
.brand b{font:600 26px/1 var(--serif);color:#fff;display:block;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:#9FC2B6}
.search input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #2C6158;background:#0A312A;color:#fff;font:inherit;font-size:14px}
.search input::placeholder{color:#7FA89B}
.grp h2{font:600 13px var(--sans);color:#8DB5A8;margin:0 8px 6px}
.grp a{display:block;padding:7px 10px;border-radius:8px;text-decoration:none;font-size:14.5px;color:#D5E6DF;border-left:3px solid transparent}
.grp a:hover{background:rgba(255,255,255,.07)}
.grp a[aria-current=page]{background:rgba(255,255,255,.12);border-left-color:var(--marigold);color:#fff;font-weight:600}
.grp{display:block}
.grp.hide,.grp a.hide{display:none}
.side .foot{margin-top:auto;font-size:12.5px;color:#8DB5A8;padding:0 8px}

/* main */
.main{padding:34px clamp(18px,4vw,48px) 40px;max-width:1200px;width:100%}
.topbar{display:none}
h1{font:600 clamp(2rem,4.5vw,2.8rem)/1.1 var(--serif);margin:0 0 8px;letter-spacing:-.02em;color:var(--pine)}
.lede{color:var(--muted);max-width:62ch;margin:0 0 28px}
.work{display:grid;grid-template-columns:minmax(290px,370px) minmax(0,1fr);gap:clamp(24px,4vw,52px);align-items:start}

/* inputs */
.inputs{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 20px 16px}
.field{margin-bottom:18px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.frow label{font-weight:600;font-size:14.5px}
.numbox{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#F8FAF9;max-width:170px}
.numbox:focus-within{border-color:var(--pine);box-shadow:0 0 0 3px rgba(13,59,51,.12)}
.numbox input{border:0;background:transparent;width:100%;min-width:70px;text-align:right;font:600 15.5px var(--sans);padding:8px 0;color:var(--ink);-moz-appearance:textfield}
.numbox input:focus{outline:none}
.numbox input::-webkit-outer-spin-button,.numbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numbox .pre,.numbox .suf{color:var(--muted);font-size:14px;font-weight:600}
.range{width:100%;accent-color:var(--pine);margin:2px 0 0}
.hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.field select,.field input[type=date]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#F8FAF9;font:500 15.5px var(--sans);color:var(--ink)}
.reset{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:600 14px var(--sans);color:var(--pine);cursor:pointer}
.reset:hover{background:#F0F5F2}

/* results */
.hero .lbl{color:var(--muted);font-weight:600;font-size:14.5px}
.hero .val{font:600 clamp(2.3rem,6vw,3.9rem)/1.05 var(--serif);color:var(--pine);letter-spacing:-.02em;overflow-wrap:anywhere;font-variant-numeric:lining-nums}
.hero .words{color:var(--moss);font-weight:600;margin-top:2px}
.hero .sub{color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:22px 0 0;border-top:1px solid var(--line)}
.stats div{padding:12px 16px 12px 0;border-bottom:1px solid var(--line)}
.stats dt{font-size:13.5px;color:var(--muted)}
.stats dd{margin:0;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.split{margin-top:24px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:10px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend s{width:11px;height:11px;border-radius:3px;display:inline-block;text-decoration:none}
.legend b{font-variant-numeric:tabular-nums}
.chart{margin:28px 0 0}
.readout{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;min-height:24px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.readout strong{font-weight:700}
.readout span{display:inline-flex;align-items:center;gap:6px}
.readout s{width:10px;height:10px;border-radius:50%;display:inline-block;text-decoration:none}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
.chart text{fill:var(--muted);font:500 11.5px var(--sans)}
details.tbl{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
details.tbl summary{cursor:pointer;font-weight:600;color:var(--pine)}
.tscroll{overflow-x:auto;margin-top:10px;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);position:sticky;top:0;background:var(--ground)}
.note{margin:24px 0 0;font-size:13.5px;color:var(--muted);max-width:68ch;border-left:3px solid var(--marigold);padding-left:12px}
.empty{background:#FBEDE9;border:1px solid #EBC2B8;border-radius:10px;padding:16px 18px;color:#7A2C1B}
.empty p{margin:4px 0 0}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:30;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(6,25,21,.5);z-index:20}
  .topbar{display:flex;align-items:center;gap:12px;background:var(--pine);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:10}
  .topbar button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:8px 12px;font:600 14px var(--sans);cursor:pointer}
  .topbar b{font:600 20px var(--serif)}
  .main{padding-top:24px}
  .work{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="topbar"><button id="menu" aria-expanded="false" aria-controls="side">Menu</button><b>Hisaab</b></div>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="side" id="side" aria-label="Calculators">
    <a class="brand" href="#sip"><div class="mark" aria-hidden="true">₹</div><div><b>Hisaab</b><span>Money and date calculators</span></div></a>
    <div class="search"><input id="q" type="search" placeholder="Find a calculator" aria-label="Find a calculator"></div>
    <nav id="nav"></nav>
    <p class="foot">Results are estimates for planning. They are not investment, tax or legal advice.</p>
  </aside>
  <main class="main" id="content">
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="work">
      <section class="inputs" aria-label="Inputs">
        <form id="form" onsubmit="return false"></form>
        <button class="reset" id="reset" type="button">Reset to defaults</button>
      </section>
      <section id="result" aria-live="polite"></section>
    </div>
  </main>
</div>

<script>
/* ---------- helpers ---------- */
const C = {pine:'#0D3B33', marigold:'#F0A500', moss:'#2E8B68', brick:'#C4472D'};
const num = (n,d=2)=>Number(n).toLocaleString('en-IN',{maximumFractionDigits:d});
const fmt = n => (n<0?'-':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const pct = (n,d=2)=>num(n,d)+'%';
const words = n => { const a=Math.abs(n); if(a>=1e7) return num(n/1e7)+' crore'; if(a>=1e5) return num(n/1e5)+' lakh'; if(a>=1e3) return num(n/1e3)+' thousand'; return ''; };
const short = n => n>=1e7? +(n/1e7).toFixed(1)+' Cr' : n>=1e5? +(n/1e5).toFixed(1)+' L' : n>=1e3? +(n/1e3).toFixed(0)+'K' : Math.round(n)+'';
const pl = (n,w)=>`${n} ${w}${n===1?'':'s'}`;
const ymText = m => { m=Math.round(m); const y=Math.floor(m/12), r=m%12; return [y?pl(y,'year'):'', r||!y?pl(r,'month'):''].filter(Boolean).join(' '); };
const yrPts = T => { const a=[]; for(let y=0;y<=Math.floor(T);y++) a.push(y); if(T>Math.floor(T)) a.push(T); return a; };

/* dates */
const pad = n=>String(n).padStart(2,'0');
const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = ()=>iso(new Date());
const inDays = n=>{const d=new Date(); d.setDate(d.getDate()+n); return iso(d);};
const pd = s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const dim = (y,m)=>new Date(y,m+1,0).getDate();
const fmtDate = d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const weekday = d=>d.toLocaleDateString('en-IN',{weekday:'long'});
const dayDiff = (a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
const addDays = (d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addMonths = (d,n)=>{ const t=new Date(d.getFullYear(),d.getMonth()+n,1); t.setDate(Math.min(d.getDate(),dim(t.getFullYear(),t.getMonth()))); return t; };
function ymd(a,b){ // a <= b
  let y=b.getFullYear()-a.getFullYear(), m=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate();
  if(d<0){ m--; const pm=b.getMonth()-1; d+=dim(pm<0?b.getFullYear()-1:b.getFullYear(),(pm+12)%12); }
  if(m<0){ y--; m+=12; }
  return {y,m,d};
}
const ymdText = o => [o.y?pl(o.y,'year'):'',o.m?pl(o.m,'month'):'',o.d||(!o.y&&!o.m)?pl(o.d,'day'):''].filter(Boolean).join(' ');

/* loans */
const emiOf = (P,r,n)=> r===0? P/n : P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
const balAfter = (P,r,n,k)=>{ const e=emiOf(P,r,n); return r===0? P-e*k : P*Math.pow(1+r,k)-e*(Math.pow(1+r,k)-1)/r; };

/* field builders */
const money=(id,label,value,min,max,step,hint)=>({id,label,type:'num',unit:'₹',value,min,max,step,hint});
const rate=(id,label,value,min=1,max=30,step=0.1,hint)=>({id,label,type:'num',unit:'%',value,min,max,step,hint});
const yrs=(id,label,value,min,max,step=1,hint)=>({id,label,type:'num',unit:'yrs',value,min,max,step,hint});
const cnt=(id,label,value,min,max,step,unit,hint)=>({id,label,type:'num',unit,value,min,max,step,hint});
const whole=(id,label,value,unit)=>({id,label,type:'int',unit,value,min:0});
const pick=(id,label,value,options,hint)=>({id,label,type:'select',value,options,hint});
const date=(id,label,value,hint)=>({id,label,type:'date',value,hint});
const FREQ=[['4','Quarterly'],['12','Monthly'],['2','Half-yearly'],['1','Yearly']];

/* ---------- tools ---------- */
const GROUPS=['Grow your money','Loans','Deposits','Tax','Dates'];
const TOOLS=[

{id:'sip',group:0,name:'SIP calculator',desc:'See what a monthly investment could grow to, with an optional yearly step-up.',
 fields:[money('amount','Monthly investment',10000,500,200000,500),rate('rate','Expected return (p.a.)',12,1,30,0.1),yrs('years','Time period',10,1,40),cnt('step','Yearly step-up',0,0,25,1,'%','Raise your SIP by this much every year.')],
 compute(v){
  const i=v.rate/1200,n=Math.round(v.years*12); let bal=0,inv=0,p=v.amount; const pts=[{x:0,a:0,b:0}];
  for(let m=1;m<=n;m++){ if(m>1&&(m-1)%12===0) p*=1+v.step/100; bal=(bal+p)*(1+i); inv+=p; if(m%12===0||m===n) pts.push({x:m/12,a:inv,b:bal}); }
  const gain=bal-inv;
  return {hero:{label:'Estimated value',value:fmt(bal),words:words(bal),sub:`${pl(v.years,'year')} of investing ${fmt(v.amount)} a month`},
   stats:[['Total invested',fmt(inv)],['Estimated returns',fmt(gain)],['Money multiple',num(bal/inv,2)+'x'],['Return share of final value',pct(gain/bal*100,1)]],
   split:[{label:'Invested',value:inv,color:'marigold'},{label:'Returns',value:gain,color:'moss'}],
   chart:{points:pts,series:[{key:'b',label:'Value',color:C.pine,fill:true},{key:'a',label:'Invested',color:C.marigold,fill:true}]},
   table:{title:'Year-by-year growth',head:['Year','Invested','Returns','Value'],rows:pts.slice(1).map(p=>['Year '+num(p.x,1),fmt(p.a),fmt(p.b-p.a),fmt(p.b)])},
   note:'Assumes the amount is invested at the start of each month and returns compound monthly. Market-linked returns vary and are not guaranteed.'};
 }},

{id:'lumpsum',group:0,name:'Lumpsum calculator',desc:'Project the future value of a one-time investment.',
 fields:[money('amount','Investment amount',500000,5000,10000000,5000),rate('rate','Expected return (p.a.)',12,1,30,0.1),yrs('years','Time period',10,1,40)],
 compute(v){
  const pts=yrPts(v.years).map(t=>({x:t,a:v.amount,b:v.amount*Math.pow(1+v.rate/100,t)}));
  const fv=pts[pts.length-1].b,gain=fv-v.amount;
  return {hero:{label:'Estimated value',value:fmt(fv),words:words(fv),sub:`Your money grows ${num(fv/v.amount,2)} times`},
   stats:[['Invested',fmt(v.amount)],['Estimated returns',fmt(gain)],['Return share of final value',pct(gain/fv*100,1)]],
   split:[{label:'Invested',value:v.amount,color:'marigold'},{label:'Returns',value:gain,color:'moss'}],
   chart:{points:pts,series:[{key:'b',label:'Value',color:C.pine,fill:true},{key:'a',label:'Invested',color:C.marigold,fill:true}]},
   table:{title:'Year-by-year growth',head:['Year','Invested','Returns','Value'],rows:pts.slice(1).map(p=>['Year '+num(p.x,1),fmt(p.a),fmt(p.b-p.a),fmt(p.b)])},
   note:'Returns are compounded yearly. Actual returns vary and are not guaranteed.'};
 }},

{id:'goal',group:0,name:'Goal planner',desc:'Find the monthly SIP you need to reach a target amount.',
 fields:[money('target','Target amount',10000000,100000,100000000,100000),yrs('years','Time to goal',15,1,40),rate('rate','Expected return (p.a.)',12,1,30,0.1)],
 compute(v){
  const i=v.rate/1200,n=Math.round(v.years*12);
  const sip=i===0? v.target/n : v.target*i/((Math.pow(1+i,n)-1)*(1+i));
  const lump=v.target/Math.pow(1+v.rate/100,v.years);
  const pts=[{x:0,a:0,b:0}]; let bal=0,inv=0;
  for(let m=1;m<=n;m++){ bal=(bal+sip)*(1+i); inv+=sip; if(m%12===0||m===n) pts.push({x:m/12,a:inv,b:bal}); }
  return {hero:{label:'Monthly SIP needed',value:fmt(sip),words:words(sip),sub:`to reach ${fmt(v.target)} in ${pl(v.years,'year')}`},
   stats:[['Total you invest',fmt(inv)],['Returns needed from market',fmt(v.target-inv)],['Or invest once today',fmt(lump)]],
   split:[{label:'Invested',value:inv,color:'marigold'},{label:'Returns',value:v.target-inv,color:'moss'}],
   chart:{points:pts,series:[{key:'b',label:'Value',color:C.pine,fill:true},{key:'a',label:'Invested',color:C.marigold,fill:true}]},
   note:'Assumes a constant return and monthly investing at the start of each month.'};
 }},

{id:'swp',group:0,name:'SWP calculator',desc:'Check how long a corpus lasts when you withdraw a fixed amount every month.',
 fields:[money('corpus','Starting corpus',5000000,100000,100000000,100000),money('w','Monthly withdrawal',30000,1000,500000,1000),rate('rate','Expected return (p.a.)',8,1,20,0.1),yrs('years','Time period',20,1,40)],
 compute(v){
  const i=v.rate/1200,n=Math.round(v.years*12); let bal=v.corpus,out=0,dead=0; const pts=[{x:0,a:0,b:bal}];
  for(let m=1;m<=n;m++){
    if(!dead){ const take=Math.min(v.w,bal); bal=(bal-take)*(1+i); out+=take; if(bal<=0.5||take<v.w){ bal=0; dead=m; } }
    if(m%12===0||m===n) pts.push({x:m/12,a:out,b:bal});
  }
  const ok=!dead;
  return {hero:{label:ok?'Corpus left at the end':'Corpus runs out in',value:ok?fmt(bal):ymText(dead),words:ok?words(bal):'',sub:ok?`after withdrawing ${fmt(out)} in total`:`You planned ${pl(v.years,'year')}. Lower the withdrawal or raise the corpus.`},
   stats:[['Total withdrawn',fmt(out)],['Starting corpus',fmt(v.corpus)],['Withdrawal as % of corpus (yearly)',pct(v.w*12/v.corpus*100,1)]],
   chart:{points:pts,series:[{key:'b',label:'Corpus left',color:C.pine,fill:true},{key:'a',label:'Total withdrawn',color:C.marigold,fill:false}]},
   table:{title:'Year-by-year',head:['Year','Withdrawn so far','Corpus left'],rows:pts.slice(1).map(p=>['Year '+num(p.x,1),fmt(p.a),fmt(p.b)])},
   note:'Withdrawals happen at the start of each month and the rest earns the return. Returns are not guaranteed, and taxes are not included.'};
 }},

{id:'cagr',group:0,name:'CAGR calculator',desc:'Work out the yearly growth rate between a starting and ending value.',
 fields:[money('initial','Starting value',100000,1000,10000000,1000),money('final','Ending value',250000,1000,50000000,1000),yrs('years','Time period',5,0.5,40,0.5)],
 compute(v){
  const c=Math.pow(v.final/v.initial,1/v.years)-1;
  const pts=yrPts(v.years).map(t=>({x:t,a:v.initial,b:v.initial*Math.pow(1+c,t)}));
  return {hero:{label:'CAGR',value:pct(c*100),words:'',sub:`${fmt(v.initial)} became ${fmt(v.final)} in ${num(v.years,1)} years`},
   stats:[['Absolute gain',fmt(v.final-v.initial)],['Absolute return',pct((v.final/v.initial-1)*100,1)],['Money multiple',num(v.final/v.initial,2)+'x']],
   chart:{points:pts,series:[{key:'b',label:'Value at CAGR',color:C.pine,fill:true},{key:'a',label:'Starting value',color:C.marigold,fill:false}]},
   note:'CAGR smooths out ups and downs into one steady yearly rate. Use it only for a single lump investment with no additions or withdrawals.'};
 }},

{id:'compound',group:0,name:'Simple vs compound interest',desc:'Compare what the same money earns with simple and compound interest.',
 fields:[money('p','Principal',100000,1000,10000000,1000),rate('rate','Interest rate (p.a.)',8,1,30,0.1),yrs('years','Time period',10,1,40),pick('freq','Compounding',' 1',[['1','Yearly'],['2','Half-yearly'],['4','Quarterly'],['12','Monthly'],['365','Daily']])],
 compute(v){
  const m=Number(v.freq)||1,r=v.rate/100;
  const comp=t=>v.p*Math.pow(1+r/m,m*t), simp=t=>v.p*(1+r*t);
  const pts=yrPts(v.years).map(t=>({x:t,a:simp(t),b:comp(t)}));
  const C1=comp(v.years),S1=simp(v.years);
  return {hero:{label:'Compound interest amount',value:fmt(C1),words:words(C1),sub:`${fmt(C1-S1)} more than simple interest`},
   stats:[['Compound interest earned',fmt(C1-v.p)],['Simple interest amount',fmt(S1)],['Simple interest earned',fmt(S1-v.p)],['Effective yearly rate',pct((Math.pow(1+r/m,m)-1)*100)]],
   chart:{points:pts,series:[{key:'b',label:'Compound',color:C.pine,fill:true},{key:'a',label:'Simple',color:C.marigold,fill:false}]},
   table:{title:'Year-by-year',head:['Year','Simple','Compound'],rows:pts.slice(1).map(p=>['Year '+num(p.x,1),fmt(p.a),fmt(p.b)])}};
 }},

{id:'inflation',group:0,name:'Inflation calculator',desc:'See what today\'s expense will cost in the future.',
 fields:[money('cost','Amount today',50000,1000,10000000,1000),rate('rate','Inflation (p.a.)',6,0.5,15,0.1),yrs('years','Years from now',20,1,50)],
 compute(v){
  const r=v.rate/100,pts=yrPts(v.years).map(t=>({x:t,a:v.cost,b:v.cost*Math.pow(1+r,t)}));
  const fut=pts[pts.length-1].b;
  return {hero:{label:'Same lifestyle will cost',value:fmt(fut),words:words(fut),sub:`${fmt(v.cost)} today, after ${pl(v.years,'year')} at ${num(v.rate,1)}% inflation`},
   stats:[['Extra cost',fmt(fut-v.cost)],['Prices rise by',num(fut/v.cost,2)+'x'],['Purchasing power of '+fmt(v.cost)+' then',fmt(v.cost/Math.pow(1+r,v.years))]],
   chart:{points:pts,series:[{key:'b',label:'Cost in future',color:C.brick,fill:true},{key:'a',label:'Cost today',color:C.marigold,fill:false}]},
   note:'Purchasing power shows what the same rupee amount would buy, in today\'s terms, after the years you chose.'};
 }},

{id:'emi',group:1,name:'EMI calculator',desc:'Find your monthly loan instalment and see how much of it is interest.',
 fields:[money('amount','Loan amount',2500000,50000,50000000,50000),rate('rate','Interest rate (p.a.)',8.5,1,30,0.05),yrs('years','Loan tenure',20,0.5,30,0.5,'Type 2.5 for 30 months.')],
 compute(v){
  const n=Math.round(v.years*12); if(n<1) return {error:'Tenure must be at least one month.'};
  const r=v.rate/1200,emi=emiOf(v.amount,r,n),total=emi*n,interest=total-v.amount;
  let bal=v.amount,yp=0,yi=0; const pts=[{x:0,a:bal}],rows=[];
  for(let m=1;m<=n;m++){ const it=bal*r,pr=emi-it; bal=Math.max(0,bal-pr); yp+=pr; yi+=it;
    if(m%12===0||m===n){ rows.push(['Year '+Math.ceil(m/12),fmt(yp),fmt(yi),fmt(bal)]); pts.push({x:m/12,a:bal}); yp=0; yi=0; } }
  return {hero:{label:'Monthly EMI',value:fmt(emi),words:words(emi),sub:`for ${pl(n,'month')} (${ymText(n)})`},
   stats:[['Loan amount',fmt(v.amount)],['Total interest',fmt(interest)],['Total payment',fmt(total)],['Interest as % of payment',pct(interest/total*100,1)]],
   split:[{label:'Principal',value:v.amount,color:'pine'},{label:'Interest',value:interest,color:'brick'}],
   chart:{points:pts,series:[{key:'a',label:'Loan balance',color:C.pine,fill:true}]},
   table:{title:'Year-by-year repayment',head:['Year','Principal paid','Interest paid','Balance'],rows},
   note:'Early EMIs are mostly interest; the principal share grows over time. Your bank\'s figure can differ slightly due to rounding and EMI dates.'};
 }},

{id:'foreclosure',group:1,name:'Loan foreclosure',desc:'Find out what you must pay to close your loan today and how much interest you save.',
 fields:[money('amount','Original loan amount',2500000,50000,50000000,50000),rate('rate','Interest rate (p.a.)',8.5,1,30,0.05),yrs('years','Original tenure',20,0.5,30,0.5),cnt('paid','EMIs already paid',36,0,360,1,'EMIs'),cnt('charge','Foreclosure charge',0,0,6,0.25,'%','Charged on the outstanding principal. Floating-rate loans to individuals usually have none; fixed-rate loans may. Check your loan agreement.')],
 compute(v){
  const n=Math.round(v.years*12),k=Math.round(v.paid);
  if(k>=n) return {error:'All EMIs are already paid, so there is nothing left to foreclose.'};
  const r=v.rate/1200,emi=emiOf(v.amount,r,n),out=balAfter(v.amount,r,n,k),charge=out*v.charge/100,pay=out+charge;
  const remain=n-k,futInt=emi*remain-out,paidInt=emi*k-(v.amount-out);
  return {hero:{label:'Amount to close the loan today',value:fmt(pay),words:words(pay),sub:`after ${pl(k,'EMI')} of ${fmt(emi)}`},
   stats:[['Outstanding principal',fmt(out)],['Foreclosure charge',fmt(charge)],['EMIs remaining',`${remain} (${ymText(remain)})`],['Interest you would still pay',fmt(futInt)],['Net interest saved',fmt(futInt-charge)],['Interest paid so far',fmt(paidInt)]],
   split:[{label:'Principal left',value:out,color:'pine'},{label:'Future interest you avoid',value:futInt,color:'moss'}],
   note:'Your lender\'s quote may differ a little because of interest accrued since your last EMI date. Ask for an official foreclosure statement before paying.'};
 }},

{id:'prepay',group:1,name:'Part-prepayment',desc:'See how a lump-sum prepayment cuts your tenure or your EMI.',
 fields:[money('amount','Original loan amount',2500000,50000,50000000,50000),rate('rate','Interest rate (p.a.)',8.5,1,30,0.05),yrs('years','Original tenure',20,0.5,30,0.5),cnt('paid','EMIs already paid',24,0,360,1,'EMIs'),money('prepay','Prepayment amount',300000,0,20000000,10000),pick('mode','After prepaying','tenure',[['tenure','Keep EMI, finish sooner'],['emi','Keep tenure, lower EMI']])],
 compute(v){
  const n=Math.round(v.years*12),k=Math.round(v.paid);
  if(k>=n) return {error:'All EMIs are already paid.'};
  const r=v.rate/1200,emi=emiOf(v.amount,r,n),out=balAfter(v.amount,r,n,k),p=Math.min(v.prepay,out),o2=out-p,remain=n-k,oldInt=emi*remain-out;
  let hero,stats;
  if(v.mode==='tenure'){
    const nn=o2<=0?0:(r===0?o2/emi:Math.log(emi/(emi-o2*r))/Math.log(1+r)); const saved=oldInt-(emi*nn-o2);
    hero={label:'Interest saved',value:fmt(saved),words:words(saved),sub:`Loan ends ${ymText(remain-nn)} earlier`};
    stats=[['Outstanding before',fmt(out)],['Outstanding after',fmt(o2)],['EMI (unchanged)',fmt(emi)],['Old remaining tenure',ymText(remain)],['New remaining tenure',ymText(nn)]];
  } else {
    const e2=o2>0?emiOf(o2,r,remain):0; const saved=oldInt-(e2*remain-o2);
    hero={label:'Interest saved',value:fmt(saved),words:words(saved),sub:`EMI drops from ${fmt(emi)} to ${fmt(e2)}`};
    stats=[['Outstanding before',fmt(out)],['Outstanding after',fmt(o2)],['Old EMI',fmt(emi)],['New EMI',fmt(e2)],['Remaining tenure',ymText(remain)]];
  }
  return {hero,stats,note:(v.prepay>out?'The prepayment is capped at your outstanding principal. ':'')+'Some lenders charge a fee on part-prepayments for fixed-rate loans. Check your agreement.'};
 }},

{id:'fd',group:2,name:'Fixed deposit (FD)',desc:'Calculate the maturity amount of a fixed deposit.',
 fields:[money('amount','Deposit amount',500000,10000,10000000,10000),rate('rate','Interest rate (p.a.)',7,1,12,0.05),yrs('years','Tenure',5,0.25,10,0.25),pick('freq','Interest compounding','4',FREQ)],
 compute(v){
  const m=Number(v.freq),r=v.rate/100,M=t=>v.amount*Math.pow(1+r/m,m*t);
  const pts=yrPts(v.years).map(t=>({x:t,a:v.amount,b:M(t)})),mat=M(v.years);
  return {hero:{label:'Maturity amount',value:fmt(mat),words:words(mat),sub:`Interest earned ${fmt(mat-v.amount)}`},
   stats:[['Deposit',fmt(v.amount)],['Interest earned',fmt(mat-v.amount)],['Effective yearly yield',pct((Math.pow(1+r/m,m)-1)*100)]],
   split:[{label:'Deposit',value:v.amount,color:'marigold'},{label:'Interest',value:mat-v.amount,color:'moss'}],
   chart:{points:pts,series:[{key:'b',label:'Value',color:C.pine,fill:true},{key:'a',label:'Deposit',color:C.marigold,fill:true}]},
   note:'Banks usually compound FD interest quarterly. Interest is taxable; TDS rules and senior-citizen rates are not included.'};
 }},

{id:'rd',group:2,name:'Recurring deposit (RD)',desc:'Calculate what a monthly recurring deposit grows to.',
 fields:[money('amount','Monthly deposit',5000,500,100000,500),rate('rate','Interest rate (p.a.)',6.8,1,12,0.05),yrs('years','Tenure',5,0.5,10,0.5)],
 compute(v){
  const n=Math.round(v.years*12),r=v.rate/100;
  const M=m=>{ let s=0; for(let j=1;j<=m;j++) s+=v.amount*Math.pow(1+r/4,4*(m-j+1)/12); return s; };
  const pts=[{x:0,a:0,b:0}]; for(let m=12;m<n;m+=12) pts.push({x:m/12,a:v.amount*m,b:M(m)}); pts.push({x:n/12,a:v.amount*n,b:M(n)});
  const mat=M(n),inv=v.amount*n;
  return {hero:{label:'Maturity amount',value:fmt(mat),words:words(mat),sub:`Interest earned ${fmt(mat-inv)}`},
   stats:[['Total deposited',fmt(inv)],['Interest earned',fmt(mat-inv)]],
   split:[{label:'Deposited',value:inv,color:'marigold'},{label:'Interest',value:mat-inv,color:'moss'}],
   chart:{points:pts,series:[{key:'b',label:'Value',color:C.pine,fill:true},{key:'a',label:'Deposited',color:C.marigold,fill:true}]},
   note:'Uses quarterly compounding, which is how most banks calculate RDs. Your bank\'s maturity value can differ slightly.'};
 }},

{id:'ppf',group:2,name:'PPF calculator',desc:'Estimate the maturity of your Public Provident Fund account.',
 fields:[money('dep','Yearly deposit',150000,500,150000,500,'The yearly limit is ₹1.5 lakh.'),rate('rate','Interest rate (p.a.)',7.1,1,12,0.05,'The government revises this every quarter. Check the current rate.'),yrs('years','Duration',15,15,50,1,'The minimum lock-in is 15 years.')],
 compute(v){
  const r=v.rate/100; let bal=0; const pts=[{x:0,a:0,b:0}];
  for(let y=1;y<=v.years;y++){ bal=(bal+v.dep)*(1+r); pts.push({x:y,a:v.dep*y,b:bal}); }
  const inv=v.dep*v.years;
  return {hero:{label:'Maturity value',value:fmt(bal),words:words(bal),sub:`Interest earned ${fmt(bal-inv)}`},
   stats:[['Total deposited',fmt(inv)],['Interest earned',fmt(bal-inv)]],
   split:[{label:'Deposited',value:inv,color:'marigold'},{label:'Interest',value:bal-inv,color:'moss'}],
   chart:{points:pts,series:[{key:'b',label:'Balance',color:C.pine,fill:true},{key:'a',label:'Deposited',color:C.marigold,fill:true}]},
   table:{title:'Year-by-year balance',head:['Year','Deposited','Balance'],rows:pts.slice(1).map(p=>['Year '+p.x,fmt(p.a),fmt(p.b)])},
   note:'Assumes the full amount is deposited at the start of each year and compounded yearly. The interest rate changes over time, so the real maturity will differ.'};
 }},

{id:'gst',group:3,name:'GST calculator',desc:'Add GST to a price or take it out of a GST-inclusive price.',
 fields:[money('amount','Amount',10000,100,1000000,100),{id:'rate',label:'GST rate',type:'num',unit:'%',value:18,min:0,max:40,step:0.25},pick('mode','Calculate','add',[['add','Add GST to amount'],['remove','Remove GST from amount']])],

{id:'days',group:4,name:'Days between dates',desc:'Count the days, weeks, months and working days between two dates.',
 fields:[date('start','Start date',todayISO),date('end','End date',()=>inDays(30)),pick('incl','Count the end date too?','0',[['0','No'],['1','Yes']])],
 compute(v){
  if(!v.start||!v.end) return {error:'Pick both dates.'};
  let a=pd(v.start),b=pd(v.end),swapped=false; if(b<a){[a,b]=[b,a]; swapped=true;}
  const inc=Number(v.incl),last=addDays(b,inc),n=dayDiff(a,last);
  let wk=0; for(let d=new Date(a);d<last;d=addDays(d,1)){ const w=d.getDay(); if(w>0&&w<6) wk++; }
  return {hero:{label:'Total days',value:num(n,0),words:'',sub:`${fmtDate(a)} to ${fmtDate(b)}`+(swapped?' (dates swapped because the end was earlier)':'')},
   stats:[['Weeks and days',`${Math.floor(n/7)} weeks ${n%7} days`],['Years, months, days',ymdText(ymd(a,last))],['Weekdays (Mon to Fri)',num(wk,0)],['Weekend days',num(n-wk,0)],['Hours',num(n*24,0)]],
   note:'Weekdays ignore public holidays.'};
 }},

{id:'adddays',group:4,name:'Add or subtract days',desc:'Find the date that falls after or before a given period.',
 fields:[date('start','Start date',todayISO),pick('op','Operation','add',[['add','Add'],['sub','Subtract']]),whole('years','Years',0,'yrs'),whole('months','Months',0,'mo'),whole('days','Days',90,'days')],
 compute(v){
  if(!v.start) return {error:'Pick a start date.'};
  const s=pd(v.start),sg=v.op==='sub'?-1:1; let d=addMonths(s,sg*(Math.round(v.years)*12+Math.round(v.months))); d=addDays(d,sg*Math.round(v.days));
  const n=Math.abs(dayDiff(s,d));
  return {hero:{label:'Resulting date',value:fmtDate(d),words:'',sub:weekday(d)},
   stats:[['Total days apart',num(n,0)],['Weeks and days',`${Math.floor(n/7)} weeks ${n%7} days`],['Start date falls on',weekday(s)]]};

{id:'age',group:4,name:'Age calculator',desc:'Get your exact age from a date of birth, plus your next birthday.',
 fields:[date('dob','Date of birth','2000-01-01'),date('ason','Age as on',todayISO)],
 compute(v){
  if(!v.dob||!v.ason) return {error:'Pick both dates.'};
  const b=pd(v.dob),t=pd(v.ason); if(b>t) return {error:'The date of birth is after the "age as on" date.'};
  const a=ymd(b,t); let nb=new Date(t.getFullYear(),b.getMonth(),1); nb.setDate(Math.min(b.getDate(),dim(nb.getFullYear(),nb.getMonth())));
  if(nb<t){ nb=new Date(t.getFullYear()+1,b.getMonth(),1); nb.setDate(Math.min(b.getDate(),dim(nb.getFullYear(),nb.getMonth()))); }

{id:'dob',group:4,name:'Date of birth finder',desc:'Work backwards from an age to the date of birth.',
 fields:[whole('y','Age, years',30,'yrs'),whole('m','Months',0,'mo'),whole('d','Days',0,'days'),date('ason','Age as on',todayISO)],
 compute(v){
  if(!v.ason) return {error:'Pick the "age as on" date.'};
  const t=pd(v.ason),y=Math.round(v.y),m=Math.round(v.m),d=Math.round(v.d);

  if(m===0&&d===0){ const early=addDays(addMonths(t,-12*(y+1)),1),late=addMonths(t,-12*y); stats.push(['Possible range for whole-year age',`${fmtDate(early)} to ${fmtDate(late)}`]); }
  return {hero:{label:'Date of birth',value:fmtDate(dob),words:'',sub:weekday(dob)},stats,
   note:'If the age is given only in whole years, the real birth date can be anywhere in the range shown, and this result is the latest date that fits.'};
 }}
];

/* ---------- state ---------- */
const states={};
const byId=id=>TOOLS.find(t=>t.id===id);
const initState=t=>{ const s={}; t.fields.forEach(f=>{ s[f.id]= typeof f.value==='function'? f.value() : String(f.value).trim(); }); return s; };
let current=null;

/* ---------- nav ---------- */
const nav=document.getElementById('nav');
GROUPS.forEach((g,gi)=>{
  const sec=document.createElement('div'); sec.className='grp'; sec.dataset.g=gi;
  sec.innerHTML=`<h2>${g}</h2>`+TOOLS.filter(t=>t.group===gi).map(t=>`<a href="#${t.id}" data-id="${t.id}">${t.name}</a>`).join('');
  nav.appendChild(sec);
});
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  nav.querySelectorAll('.grp').forEach(g=>{
    let any=false;
    g.querySelectorAll('a').forEach(a=>{ const hit=!q||a.textContent.toLowerCase().includes(q); a.classList.toggle('hide',!hit); if(hit)any=true; });
    g.classList.toggle('hide',!any);
  });
});
const side=document.getElementById('side'),scrim=document.getElementById('scrim'),menu=document.getElementById('menu');
const toggleMenu=open=>{ side.classList.toggle('open',open); scrim.classList.toggle('open',open); menu.setAttribute('aria-expanded',open); };
menu.onclick=()=>toggleMenu(!side.classList.contains('open')); scrim.onclick=()=>toggleMenu(false);

/* ---------- form ---------- */
const form=document.getElementById('form');
function buildForm(t){
  const st=states[t.id]; form.innerHTML='';
  t.fields.forEach(f=>{
    const w=document.createElement('div'); w.className='field'; const id='f-'+f.id; let html='';
    if(f.type==='num'||f.type==='int'){
      const pre=f.unit==='₹'?'<span class="pre">₹</span>':'', suf=f.unit&&f.unit!=='₹'?`<span class="suf">${f.unit}</span>`:'';
      html=`<div class="frow"><label for="${id}">${f.label}</label><div class="numbox">${pre}<input id="${id}" type="number" inputmode="decimal" step="any" min="0" value="${st[f.id]}">${suf}</div></div>`;
      if(f.type==='num') html+=`<input class="range" type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${st[f.id]}" aria-label="${f.label} slider">`;
      if(f.unit==='₹') html+=`<div class="hint" data-w></div>`;
    } else if(f.type==='select'){
      html=`<label for="${id}" class="frow" style="display:block">${f.label}</label><select id="${id}">${f.options.map(o=>`<option value="${o[0]}"${String(st[f.id]).trim()===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`;
    } else {
      html=`<label for="${id}" class="frow" style="display:block">${f.label}</label><input id="${id}" type="date" value="${st[f.id]}">`;
    }
    if(f.hint) html+=`<div class="hint">${f.hint}</div>`;
    w.innerHTML=html; form.appendChild(w);
    const inp=w.querySelector('#'+id),rng=w.querySelector('.range'),wd=w.querySelector('[data-w]');
    const showWords=()=>{ if(wd){ const n=Number(st[f.id]); wd.textContent=isFinite(n)&&n>0?`${fmt(n)}${words(n)?' ('+words(n)+')':''}`:''; } };
    showWords();
    inp.addEventListener('input',()=>{ st[f.id]=inp.value; if(rng&&inp.value!=='') rng.value=inp.value; showWords(); run(); });
    if(rng) rng.addEventListener('input',()=>{ st[f.id]=rng.value; inp.value=rng.value; showWords(); run(); });
  });
}

/* ---------- result ---------- */
const out=document.getElementById('result');
function run(){
  const t=current,st=states[t.id],v={};
  for(const f of t.fields){
    if(f.type==='num'||f.type==='int'){
      const x=st[f.id]===''?NaN:Number(st[f.id]); v[f.id]=x;
      const need=f.type==='num'&&f.min>0;
      if(!isFinite(x)||x<0||(need&&x<=0)) return out.innerHTML=`<div class="empty"><strong>Check your inputs</strong><p>Enter a ${need?'number above zero':'valid number'} for "${f.label}".</p></div>`;
    } else v[f.id]=st[f.id];
  }
  let r; try{ r=t.compute(v); }catch(e){ r={error:'Something in these inputs could not be calculated. Try different values.'}; }
  if(r.error) return out.innerHTML=`<div class="empty"><strong>Check your inputs</strong><p>${r.error}</p></div>`;
  let h=`<div class="hero"><div class="lbl">${r.hero.label}</div><div class="val">${r.hero.value}</div>${r.hero.words?`<div class="words">${r.hero.words}</div>`:''}${r.hero.sub?`<div class="sub">${r.hero.sub}</div>`:''}</div>`;
  if(r.stats) h+=`<dl class="stats">${r.stats.map(s=>`<div><dt>${s[0]}</dt><dd>${s[1]}</dd></div>`).join('')}</dl>`;
  if(r.split){ const tot=r.split.reduce((a,p)=>a+Math.max(0,p.value),0)||1;
    h+=`<div class="split"><div class="bar" role="img" aria-label="${r.split.map(p=>p.label+' '+pct(p.value/tot*100,0)).join(', ')}">${r.split.map(p=>`<i style="width:${Math.max(0,p.value)/tot*100}%;background:${C[p.color]}"></i>`).join('')}</div><div class="legend">${r.split.map(p=>`<span><s style="background:${C[p.color]}"></s>${p.label} <b>${fmt(p.value)} (${pct(p.value/tot*100,0)})</b></span>`).join('')}</div></div>`; }
  if(r.chart) h+=`<figure class="chart" id="chart"></figure>`;
  if(r.table) h+=`<details class="tbl"><summary>${r.table.title}</summary><div class="tscroll"><table><thead><tr>${r.table.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.table.rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  if(r.note) h+=`<p class="note">${r.note}</p>`;
  out.innerHTML=h;
  if(r.chart) mountChart(document.getElementById('chart'),r.chart);
}

/* ---------- chart ---------- */
function mountChart(el,ch){
  const W=680,H=280,L=58,R=16,T=14,B=30,pts=ch.points,S=ch.series;
  let ymax=0; pts.forEach(p=>S.forEach(s=>ymax=Math.max(ymax,p[s.key]||0)));
  if(ymax<=0) ymax=1; const e=Math.pow(10,Math.floor(Math.log10(ymax))),f=ymax/e; ymax=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;
  const xmin=pts[0].x,xmax=pts[pts.length-1].x;
  const sx=x=>L+(xmax===xmin?0:(x-xmin)/(xmax-xmin))*(W-L-R), sy=y=>T+(1-y/ymax)*(H-T-B);
  let g='';
  for(let i=0;i<=4;i++){ const y=ymax*i/4; g+=`<line x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}" stroke="#D3DDD7" stroke-width="1"/><text x="${L-8}" y="${sy(y)+4}" text-anchor="end">${y===0?'0':short(y)}</text>`; }
  const step=Math.ceil(pts.length/8);
  pts.forEach((p,i)=>{ if(i%step===0||(i===pts.length-1&&(pts.length-1)%step>=Math.ceil(step/2))) g+=`<text x="${sx(p.x)}" y="${H-8}" text-anchor="middle">${Number.isInteger(p.x)?p.x:p.x.toFixed(1)}</text>`; });
  g+=`<text x="${W-R}" y="${H-8}" text-anchor="end" style="opacity:0"> </text>`;
  S.forEach(s=>{
    const d=pts.map((p,i)=>`${i?'L':'M'}${sx(p.x).toFixed(1)},${sy(p[s.key]||0).toFixed(1)}`).join('');
    if(s.fill) g+=`<path d="${d}L${sx(xmax)},${sy(0)}L${sx(xmin)},${sy(0)}Z" fill="${s.color}" opacity="0.14"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  });
  g+=`<g id="hv"><line id="hl" y1="${T}" y2="${H-B}" stroke="#18302A" stroke-opacity=".35"/>${S.map((s,i)=>`<circle id="hc${i}" r="4.5" fill="#fff" stroke="${s.color}" stroke-width="2.5"/>`).join('')}</g>`;
  el.innerHTML=`<div class="readout"></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of ${S.map(s=>s.label).join(' and ')} over time">${g}</svg>`;
  const svg=el.querySelector('svg'),ro=el.querySelector('.readout');
  const set=i=>{ const p=pts[i]; svg.querySelector('#hl').setAttribute('x1',sx(p.x)); svg.querySelector('#hl').setAttribute('x2',sx(p.x));
    S.forEach((s,k)=>{ const c=svg.querySelector('#hc'+k); c.setAttribute('cx',sx(p.x)); c.setAttribute('cy',sy(p[s.key]||0)); });
    ro.innerHTML=`<strong>Year ${Number.isInteger(p.x)?p.x:p.x.toFixed(1)}</strong>`+S.map(s=>`<span><s style="background:${s.color}"></s>${s.label}: <b>${fmt(p[s.key]||0)}</b></span>`).join(''); };
  set(pts.length-1);
  const move=e=>{ const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W; let bi=0,bd=1e9; pts.forEach((p,i)=>{ const d=Math.abs(sx(p.x)-x); if(d<bd){bd=d;bi=i;} }); set(bi); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>set(pts.length-1));
}

/* ---------- routing ---------- */
function show(){
  const id=location.hash.slice(1),t=byId(id)||TOOLS[0]; current=t;
  if(!states[t.id]) states[t.id]=initState(t);
  document.title=`${t.name} | Hisaab`;
  document.getElementById('title').textContent=t.name;
  document.getElementById('lede').textContent=t.desc;
  nav.querySelectorAll('a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.id===t.id)); 
  nav.querySelectorAll('a').forEach(a=>{ if(a.dataset.id===t.id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  buildForm(t); run(); toggleMenu(false); window.scrollTo({top:0});
}
document.getElementById('reset').onclick=()=>{ states[current.id]=initState(current); buildForm(current); run(); };
window.addEventListener('hashchange',show);
show();
</script>
